*{box-sizing:border-box;margin:0;padding:0}

.search{flex:1;padding:5px 10px;font-size:12px;border:0.5px solid var(--color-border-secondary);border-radius:16px;background:transparent;color:var(--color-text-primary);font-family:var(--font-sans)}

.icon{width:16px;display:inline-block;flex-shrink:0;font-size:12px}
.name{color:var(--color-text-primary);font-weight:500}
.name.file{color:var(--color-text-secondary);font-weight:400}
.name.file.py{color:var(--color-text-info)}
.name.file.ts{color:var(--color-text-warning)}
.name.file.tsx{color:var(--color-text-warning)}

.children{display:block}

.badge{font-family:var(--font-sans);font-size:10px;padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:middle}
.badge-blue{background:var(--color-background-info);color:var(--color-text-info)}
.badge-green{background:var(--color-background-success);color:var(--color-text-success)}
.badge-amber{background:var(--color-background-warning);color:var(--color-text-warning)}
.badge-red{background:var(--color-background-danger);color:var(--color-text-danger)}
.detail-panel{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 14px;margin-top:14px;font-family:var(--font-sans)}
.detail-title{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:8px}
.detail-row{display:flex;gap:8px;font-size:12px;padding:3px 0;border-bottom:0.5px solid var(--color-border-tertiary)}

.detail-key{color:var(--color-text-tertiary);min-width:80px}

function getExt(name) {
  const parts = name.split('.');
  return parts.length > 1 ? parts[parts.length-1] : 'file';
}

function getIcon(node) {
  if(node.t === 'dir') return '▸';
  const icons = {py:'',ts:'',tsx:'',yml:'',env:'',sql:'',md:'',file:''};
  return '';
}

let allRows = [];

function buildTree(nodes, depth, parentEl) {
  nodes.forEach(node => {
    const isDir = node.t === 'dir';
    const ext = isDir ? 'dir' : getExt(node.n);
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.name = node.n;
    row.dataset.search = (node.n + ' ' + (node.desc||'')).toLowerCase();
    allRows.push(row);

    const indent = '  '.repeat(depth);
    const toggle = isDir ? '▸' : ' ';

    row.innerHTML = `<span class="indent">${indent}</span><span class="toggle" id="tog-${allRows.length}">${isDir?'▸':' '}</span><span class="name ${isDir?'dir':'file '+ext}">${node.n}${node.badge?`<span class="badge badge-${node.badge==='root'?'amber':node.badge==='Next.js'?'blue':node.badge==='FastAPI'?'green':node.badge==='LangGraph'?'amber':node.badge==='Temporal'?'red':node.badge==='STT+TTS'?'red':'blue'}">${node.badge}</span>`:''}</span>${node.desc?`<span class="desc">${node.desc}</span>`:''}`;

    parentEl.appendChild(row);

    if(isDir && node.children) {
      const childEl = document.createElement('div');
      childEl.className = 'children hidden';
      childEl.id = 'ch-' + allRows.length;
      parentEl.appendChild(childEl);
      buildTree(node.children, depth+1, childEl);
      const togId = allRows.length;
      row.onclick = (e) => {
        const ch = childEl;
        const tog = row.querySelector('.toggle');
        const isOpen = !ch.classList.contains('hidden');
        ch.classList.toggle('hidden', isOpen);
        tog.textContent = isOpen ? '▸' : '▾';
      };
    } else if(!isDir) {
      row.onclick = () => showDetail(node);
    }
  });
}

function showDetail(node) {
  const panel = document.getElementById('detail');
  const key = node.n;
  const info = fileDetails[key] || fileDetails[key.replace(' ','_')];
  if(!info && !node.desc) { panel.style.display='none'; return; }
  panel.style.display = 'block';
  let html = `<div class="detail-title">${node.n}</div>`;
  if(node.desc) html += `<div class="detail-row"><span class="detail-key">desc</span><span class="detail-val">${node.desc}</span></div>`;
  if(info) {
    Object.entries(info).forEach(([k,v]) => {
      html += `<div class="detail-row"><span class="detail-key">${k}</span><span class="detail-val">${v}</span></div>`;
    });
  }
  panel.innerHTML = html;
}

function expandAll() {
  document.querySelectorAll('.children').forEach(c => c.classList.remove('hidden'));
  document.querySelectorAll('.toggle').forEach(t => { if(t.textContent==='▸') t.textContent='▾'; });
}
function collapseAll() {
  document.querySelectorAll('.children').forEach(c => c.classList.add('hidden'));
  document.querySelectorAll('.toggle').forEach(t => { if(t.textContent==='▾') t.textContent='▸'; });
}
function searchFiles(q) {
  const lq = q.toLowerCase().trim();
  if(!lq) { allRows.forEach(r => r.style.display=''); return; }
  allRows.forEach(r => {
    const match = r.dataset.search && r.dataset.search.includes(lq);
    r.style.display = match ? '' : 'none';
    if(match) {
      let parent = r.previousElementSibling;
      while(parent) {
        if(parent.classList.contains('children')) { parent.classList.remove('hidden'); }
        parent = parent.previousElementSibling;
      }
    }
  });
}

const treeEl = document.getElementById('tree');
buildTree(tree, 0, treeEl);
</script>
